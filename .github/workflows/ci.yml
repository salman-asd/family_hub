name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # Keep in sync with pubspec.yaml (environment.flutter) and the version the
  # team develops with.  Bump deliberately, never implicitly.
  FLUTTER_VERSION: '3.47.7'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      # Goldens run in their own job (Linux-generated images only).
      - run: flutter test --exclude-tags golden --coverage
      - name: Coverage summary
        run: |
          awk -F: '/^LF:/{lf+=$2} /^LH:/{lh+=$2} END{ if (lf>0) printf "Line coverage: %.1f%% (%d of %d lines)\n", 100*lh/lf, lh, lf }' coverage/lcov.info
      - name: Leftover step TODOs (warning until H8 makes this a failure)
        run: |
          if grep -rn "TODO(step" lib test; then
            echo "::warning::TODO(step-N) markers are still in the tree (CLAUDE.md rule 23)"
          fi
      - run: flutter build apk --flavor dev -t lib/main_dev.dart

  # Image comparisons.  Only meaningful against goldens that were generated on
  # Linux by update-goldens.yml, so it skips (with a notice) until they exist.
  goldens:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Compare goldens
        run: |
          if [ -d test/shared/widgets/goldens ] && [ -d test/features/auth/presentation/screens/goldens ]; then
            flutter test --tags golden
          else
            echo "::notice::No Linux goldens committed yet. Run the 'Update goldens' workflow, download the artifact and commit it."
          fi

  # Firestore Security Rules must stay green: every rule has an allowed and a
  # denied case (roadmap Step 10).  Separate job so a rules failure is obvious
  # and does not wait behind the Android build.
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: firebase/rules_test/package-lock.json
      # The Firestore emulator is a JVM program, and firebase-tools 15 requires
      # a JDK of 21 or newer.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: node tools/check_indexes.mjs
      - run: node tools/check_indexes.test.mjs
      - run: npm ci --prefix firebase/rules_test
      - run: npm run test:emulator --prefix firebase/rules_test
