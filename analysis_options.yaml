include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - build/**
    - android/**
    - ios/**
    # Vendored JS packages (the Firestore rules test toolchain) ship Dart
    # templates that are not part of this project; analysing them fails.
    - node_modules/**
    - firebase/rules_test/node_modules/**

linter:
  rules:
    always_use_package_imports: true
    avoid_print: true
    prefer_const_constructors: true
    prefer_final_locals: true
    require_trailing_commas: true
    unawaited_futures: true
